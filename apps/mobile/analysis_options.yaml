#include: package:pedantic/analysis_options.yaml
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**.g.dart'
    - '**.freezed.dart'
  plugins:
    - dart_code_linter

dart_code_linter:
  metrics:
    cyclomatic-complexity: 20
    number-of-parameters: 4
    maximum-nesting-level: 5
  metrics-exclude:
    - test/**
  rules:
    - avoid-dynamic
    - avoid-passing-async-when-sync-expected
    - avoid-redundant-async
    - avoid-unnecessary-type-assertions
    - avoid-unnecessary-type-casts
    - avoid-unrelated-type-assertions
    - avoid-unused-parameters
    - avoid-nested-conditional-expressions
    - newline-before-return
    - no-boolean-literal-compare
    - no-empty-block
    - prefer-trailing-comma
    - prefer-conditional-expressions
    - no-equal-then-else
    - prefer-moving-to-variable
    - prefer-match-file-name
    - avoid-banned-imports:
        entries:
          - paths: [ '.*lib[\\\\/]src[\\\\/]domain[\\\\/].*\.dart$' ]
            deny: [ '^package:money_tracker/src/ui/.*$', '^(?:\.\./)+ui/.*$', '^package:money_tracker/src/data/.*$', '^(?:\.\./)+data/.*$' ]
            message: "Domain слой должен быть независимым"
          - paths: [ '.*lib[\\\\/]src[\\\\/]data[\\\\/].*\.dart$' ]
            deny: [ '^package:money_tracker/src/ui/.*$', '^(?:\.\./)+ui/.*$' ]
            message: "Data слой должен быть независимым"
          - paths: [ '.*lib[\\\\/]src[\\\\/]ui[\\\\/].*\.dart$' ]
            deny: [ '^package:money_tracker/src/data/.*$', '^(?:\.\./)+data/.*$' ]
            message: "UI слой должен быть независимым"